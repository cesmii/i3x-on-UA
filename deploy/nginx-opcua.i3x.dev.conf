# Nginx site for https://opcua.i3x.dev → the demo's front door (127.0.0.1:8084).
# Install: /etc/nginx/sites-available/opcua, symlinked from sites-enabled (deploy/README.md).
# Same pattern as the host's api.i3x.dev site: Cloudflare origin certificate, Cloudflare-only access,
# CORS for browser clients (i3X Explorer on explorer.i3x.dev), SSE-friendly proxying.

server {
    server_name opcua.i3x.dev;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare only ($from_cloudflare: sites-enabled/cloudflare-ips.conf)
    if ($from_cloudflare = 0) { return 444; }

    location / {
        # Don't let the backends' own CORS headers duplicate ours
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Vary                         Origin always;
        # No add_header inside the if, so the headers above are inherited
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Required for SSE streaming (/subscriptions/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        gzip on;
        gzip_min_length 1000;
        gzip_types text/plain application/json text/event-stream;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name opcua.i3x.dev;
    return 301 https://$host$request_uri;
}
